name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues to ensure this bug hasn't already been reported.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened? What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Connect Android device or Open Remote database
        2. Navigate to '...'
        3. Click on '....'
        4. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: VetroLog Version
      description: What version of VetroLog are you running? (Check top-right version badge or Help modal)
      placeholder: "e.g., v1.4.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon / arm64)
        - macOS (Intel / x64)
        - Windows 11 / 10 (x64)
        - Linux (Ubuntu / Debian / Fedora)
        - Web Mode (Docker / Self-hosted)
    validations:
      required: true

  - type: dropdown
    id: database_mode
    attributes:
      label: Target Database / Mode
      options:
        - Mobile ADB (Android SQLite)
        - Mobile ADB (Hive)
        - Mobile ADB (SharedPreferences)
        - Remote PostgreSQL
        - Remote MySQL / MariaDB
        - Remote Microsoft SQL Server
        - Remote Redis
        - Local SQLite File (.sqlite / .db)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Messages
      description: Please copy and paste any relevant console logs, terminal output, or stack traces here.
      render: shell

  - type: checkboxes
    id: checkboxes
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have verified that no sensitive credentials (passwords, tokens, private keys) are included in this report.
          required: true
