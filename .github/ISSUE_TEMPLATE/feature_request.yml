name: ✨ Feature Request
description: Suggest an idea or enhancement for VetroLog
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea! We prioritize features that make mobile and remote database inspection faster, safer, and more intuitive.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the frustration or limitation you are facing.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Ideal Experience
      description: Describe what you would like to happen and how you envision the user experience.
      placeholder: "It would be great if VetroLog could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or references (e.g., links to similar tools) here.
