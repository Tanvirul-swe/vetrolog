name: CI Quality Checks

on:
  push:
    branches: [ main, db-draw ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Build Frontend
        run: npm run build

  backend:
    name: Backend Go Tests & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Ensure Frontend Dist Exists for Go Embed
        run: mkdir -p frontend/dist && touch frontend/dist/index.html

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit Tests with Race Detector
        run: go test -v -race -count=1 ./...

  vscode-extension:
    name: VS Code Extension Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Extension Dependencies
        run: npm install

      - name: Typecheck Extension
        run: npx tsc --noEmit

      - name: Build Extension Bundle
        run: npm run build

      - name: Validate Extension Package
        run: npx @vscode/vsce package --no-dependencies
