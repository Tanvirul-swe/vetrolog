name: Release Build & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Universal
            os: macos-latest
            wails_platform: darwin/universal
            artifact_name: VetroLog-macOS-Universal
          - name: Windows x64
            os: windows-latest
            wails_platform: windows/amd64
            artifact_name: VetroLog-Windows-x64
          - name: Linux x64
            os: ubuntu-22.04
            wails_platform: linux/amd64
            artifact_name: VetroLog-Linux-x64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install Linux build dependencies
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # Install Wails CLI
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Install Frontend Dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # Build macOS
      - name: Build macOS Universal App
        if: runner.os == 'macOS'
        run: |
          wails build -platform ${{ matrix.platform.wails_platform }} -clean
          # Create zip archive of the .app
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent VetroLog.app VetroLog-macOS-Universal.zip
          # If create-dmg is available, build DMG installer
          brew install create-dmg || true
          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "VetroLog Installer" \
              --window-pos 200 120 \
              --window-size 600 350 \
              --icon-size 100 \
              --icon "VetroLog.app" 175 120 \
              --hide-extension "VetroLog.app" \
              --app-drop-link 425 120 \
              "VetroLog-macOS-Universal.dmg" \
              "VetroLog.app" || true
          fi

      # Build Windows
      - name: Build Windows Executable & NSIS Installer
        if: runner.os == 'Windows'
        run: |
          wails build -platform ${{ matrix.platform.wails_platform }} -clean -nsis
          cd build/bin
          Compress-Archive -Path vetrolog.exe -DestinationPath VetroLog-Windows-x64-Portable.zip

      # Build Linux
      - name: Build Linux Binary & Debian Package
        if: runner.os == 'Linux'
        run: |
          wails build -platform ${{ matrix.platform.wails_platform }} -clean
          cd build/bin
          tar -czvf VetroLog-Linux-x64.tar.gz vetrolog
          
          # Create .deb package
          mkdir -p deb/DEBIAN deb/usr/bin deb/usr/share/applications deb/usr/share/icons/hicolor/512x512/apps
          cp vetrolog deb/usr/bin/vetrolog
          chmod +x deb/usr/bin/vetrolog
          cp ../appicon.png deb/usr/share/icons/hicolor/512x512/apps/vetrolog.png
          
          VERSION_NUM="${GITHUB_REF_NAME#v}"
          VERSION_NUM="${VERSION_NUM:-1.1.0}"
          printf "%s\n" \
            "Package: vetrolog" \
            "Version: $VERSION_NUM" \
            "Section: devel" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: Md. Tanvirul Islam <tanvirul.islam.swe@gmail.com>" \
            "Description: Modern real-time mobile database inspector for Android and iOS" \
            "Depends: libgtk-3-0, libwebkit2gtk-4.0-37 | libwebkit2gtk-4.1-0" \
            > deb/DEBIAN/control

          printf "%s\n" \
            "[Desktop Entry]" \
            "Name=VetroLog" \
            "Comment=Mobile Database Inspector" \
            "Exec=/usr/bin/vetrolog" \
            "Icon=vetrolog" \
            "Terminal=false" \
            "Type=Application" \
            "Categories=Development;Debugger;" \
            > deb/usr/share/applications/vetrolog.desktop

          dpkg-deb --build deb VetroLog-Linux-amd64.deb

      # Upload Artifacts for Release
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: |
            build/bin/*.zip
            build/bin/*.dmg
            build/bin/*.tar.gz
            build/bin/*.deb
            build/bin/*-installer.exe

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  bump-homebrew:
    name: Bump Homebrew Cask
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download macOS build artifact
        uses: actions/download-artifact@v4
        with:
          name: VetroLog-macOS-Universal
          path: macos-artifact

      - name: Calculate SHA-256 and update Homebrew Tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_FILE=$(find macos-artifact -name "*.dmg" | head -n 1)
          if [ -z "$DMG_FILE" ]; then
            echo "DMG file not found, skipping cask update"
            exit 0
          fi

          SHA256=$(sha256sum "$DMG_FILE" | awk '{print $1}')
          echo "Bumping VetroLog to v${VERSION} with SHA256: ${SHA256}"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Tanvirul-swe/homebrew-tap.git" tap-repo || {
            echo "::warning::Unable to clone homebrew-tap. Set HOMEBREW_TAP_TOKEN secret with write permissions to automate."
            exit 0
          }

          cd tap-repo
          mkdir -p Casks
          printf 'cask "vetrolog" do\n  version "%s"\n  sha256 "%s"\n\n  url "https://github.com/Tanvirul-swe/vetrolog/releases/download/v#{version}/VetroLog-macOS-Universal.dmg"\n  name "VetroLog"\n  desc "Real-time Mobile SQLite Database Inspector for Flutter, Android & React Native"\n  homepage "https://vetro.hifzio.com/"\n\n  livecheck do\n    url :url\n    strategy :github_latest\n  end\n\n  app "VetroLog.app"\n\n  zap trash: [\n    "~/.vetrolog",\n    "~/Library/Preferences/com.wails.vetrolog.plist",\n    "~/Library/Saved Application State/com.wails.vetrolog.savedState",\n  ]\nend\n' "$VERSION" "$SHA256" > Casks/vetrolog.rb

          git add Casks/vetrolog.rb
          if git diff --staged --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "chore(cask): bump vetrolog to v${VERSION}"
            git push origin main || echo "::warning::Failed to push to homebrew-tap. Ensure token has repo write scope."
          fi

  publish-winget:
    name: Submit to Microsoft WinGet
    needs: release
    runs-on: windows-latest
    continue-on-error: true
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_PAT || secrets.WINGET_TOKEN }}
    steps:
      - name: Extract Version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Submit package to WinGet Community Repo
        uses: vedantmgoyal9/winget-releaser@v2
        if: ${{ env.WINGET_TOKEN != '' }}
        with:
          identifier: Hifzio.VetroLog
          version: ${{ steps.version.outputs.version }}
          installers-regex: 'VetroLog-Windows-.*\.zip$'
          token: ${{ env.WINGET_TOKEN }}