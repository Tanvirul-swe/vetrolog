ShortDescription: High-performance desktop SQLite database inspector for mobile developers
Description: |
  VetroLog is a high-performance desktop SQLite database inspector designed for mobile developers
  building applications with Flutter, Android (Room), and React Native.
  Key features include:
  - Zero SDK setup required: connects directly to running emulators and physical devices over ADB
  - Real-time WAL file synchronization and live table change streaming
  - Multi-tab SQL Playground with visual EXPLAIN QUERY PLAN execution graph
  - Gemini 2.5 Flash AI natural language query generator and 1-click index advisor
  - In-place table cell editing with optimistic UI feedback
  - Anonymous serverless telemetry and transparent privacy controls
