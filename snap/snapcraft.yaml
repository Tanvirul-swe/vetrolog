name: vetrolog
title: VetroLog
base: core22
version: '1.3.2'
summary: Real-time desktop SQLite database inspector for mobile developers
description: |
  **VetroLog** is a high-performance desktop SQLite database inspector purpose-built for mobile engineers building applications with **Flutter, Android (Room), and React Native**.

  ### 🌟 Key Highlights

  - **⚡ Zero SDK Setup**: Connects directly to running physical devices and emulators over ADB without modifying a single line of your mobile codebase.
  - **🔄 Real-Time WAL Synchronization**: Instantly captures live inserts, updates, and deletes with SQLite Write-Ahead Logging (`-wal`) and Shared Memory (`-shm`) sync.
  - **🧠 Intelligent SQL Playground**: Multi-tab query console featuring visual `EXPLAIN QUERY PLAN` execution trees, syntax highlighting, and 1-click Index Advisor recommendations.
  - **✏️ Bidirectional In-Place Editing**: Double-click any cell in the DataGrid to modify values with optimistic UI feedback and live device write-back.
  - **🤖 AI-Powered Assistant**: Natural language SQL query generation with offline support or BYOK Gemini 2.5 Flash / OpenAI.
  - **🌐 Local Web Server Mode**: Run as a desktop application or start headless in your browser with `vetrolog --web`.

  ### 📱 Framework Compatibility
  - **Flutter**: Drift, sqflite, floor
  - **Android Native**: Room, SQLiteOpenHelper, SQLDelight
  - **React Native**: react-native-sqlite-storage, op-sqlite

license: MIT
website: https://vetro.hifzio.com/
source-code: https://github.com/Tanvirul-swe/vetrolog
issues: https://github.com/Tanvirul-swe/vetrolog/issues
contact: mailto:tanvirul.islam.swe@gmail.com

grade: stable
confinement: strict

apps:
  vetrolog:
    command: bin/vetrolog
    extensions: [gnome]
    desktop: usr/share/applications/vetrolog.desktop
    plugs:
      - network
      - network-bind
      - home
      - removable-media
      - adb-support

parts:
  vetrolog:
    plugin: dump
    source: https://github.com/Tanvirul-swe/vetrolog/releases/download/v1.3.2/VetroLog-Linux-x64.tar.gz
    organize:
      vetrolog: bin/vetrolog
  metadata:
    plugin: nil
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/share/applications
      mkdir -p $CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps
      cp $CRAFT_PROJECT_DIR/distribution/desktop/vetrolog.desktop $CRAFT_PART_INSTALL/usr/share/applications/vetrolog.desktop
      cp $CRAFT_PROJECT_DIR/build/appicon.png $CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/vetrolog.png
